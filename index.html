<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConectaFlor · Florícolas y logística de exportación</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10/dist/framer-motion.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(to bottom, #f8f9fa 0%, #f0f4f8 100%);
      color: #2c3e50;
      line-height: 1.6;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #2d6a4f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      color: #666;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .nav a:hover { color: #2d6a4f; }

    .btn-cta {
      background: #d4a574;
      color: #2c3e50;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-cta:hover {
      background: #e8b892;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #2d6a4f 0%, #1a4d35 100%);
      color: white;
      padding: 8rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(212, 165, 116, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(232, 132, 127, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 800;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: -1px;
    }

    .hero p {
      font-size: clamp(18px, 3vw, 24px);
      margin-bottom: 3rem;
      opacity: 0.95;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: #d4a574;
      color: #2c3e50;
      padding: 16px 48px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(212, 165, 116, 0.3);
    }

    .btn-primary:hover {
      background: #e8b892;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(212, 165, 116, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #2d6a4f;
      padding: 16px 48px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border: 2px solid white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: transparent;
      transform: translateY(-3px);
    }

    /* SECTION */
    .section {
      padding: 6rem 2rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .section-title {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 800;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }

    .section-subtitle {
      font-size: 18px;
      color: #888;
      text-align: center;
      margin-bottom: 4rem;
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2.5rem;
      margin: 2rem 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      border: 1px solid #e8e8e8;
      transition: all 0.3s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      text-align: center;
    }

    .card:hover {
      box-shadow: 0 16px 40px rgba(45, 106, 79, 0.12);
      transform: translateY(-8px);
      border-color: #d4a574;
    }

    .card-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 1rem;
    }

    .card-text {
      font-size: 15px;
      color: #666;
      line-height: 1.8;
    }

    /* FLOW SECTION */
    .flow-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
      margin: 4rem 0;
      min-height: 500px;
    }

    .flow-box {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(45, 106, 79, 0.12);
      min-width: 240px;
      border: 2px solid #e8e8e8;
      transition: all 0.3s ease;
    }

    .flow-box:hover {
      box-shadow: 0 12px 36px rgba(45, 106, 79, 0.2);
      border-color: #2d6a4f;
    }

    .flow-icon {
      font-size: 72px;
      margin-bottom: 1.5rem;
      display: block;
    }

    .flow-title {
      font-size: 20px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 0.75rem;
    }

    .flow-text {
      font-size: 14px;
      color: #888;
    }

    .flow-arrow {
      font-size: 36px;
      color: #d4a574;
      display: flex;
      align-items: center;
    }

    /* FOOTER */
    .footer {
      background: #2c3e50;
      color: white;
      padding: 4rem 2rem;
      text-align: center;
      margin-top: 4rem;
    }

    .footer-links {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #d4a574;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .footer-links a:hover { color: #e8b892; }

    .footer-text {
      font-size: 14px;
      margin-top: 1.5rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .nav { gap: 1rem; font-size: 14px; }
      .hero { padding: 4rem 1.5rem; }
      .hero h1 { font-size: 32px; }
      .flow-container { flex-direction: column; gap: 2rem; }
      .flow-arrow { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { motion } = window.Motion;

    // SVG ICONS
    const CheckIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="30" stroke="#2d6a4f" strokeWidth="2"/>
        <path d="M20 32L28 40L44 24" stroke="#2d6a4f" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );

    const MoneyIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 24C12.9 24 12 24.9 12 26V50C12 51.1 12.9 52 14 52H50C51.1 52 52 51.1 52 50V26C52 24.9 51.1 24 50 24H14Z" stroke="#d4a574" strokeWidth="2"/>
        <circle cx="32" cy="38" r="8" stroke="#d4a574" strokeWidth="2"/>
        <path d="M32 34V42M28 38H36" stroke="#d4a574" strokeWidth="2" strokeLinecap="round"/>
      </svg>
    );

    const BoltIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 8L42 28H36L44 56L22 36H28L32 8Z" fill="#e8847f" opacity="0.3"/>
        <path d="M32 8L42 28H36L44 56L22 36H28L32 8Z" stroke="#e8847f" strokeWidth="2"/>
      </svg>
    );

    const GlobeIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="32" r="28" stroke="#2d6a4f" strokeWidth="2"/>
        <path d="M32 4C32 4 24 16 24 32C24 48 32 60 32 60C32 60 40 48 40 32C40 16 32 4 32 4Z" stroke="#2d6a4f" strokeWidth="2"/>
        <ellipse cx="32" cy="32" rx="28" ry="8" stroke="#2d6a4f" strokeWidth="2"/>
      </svg>
    );

    const FlowerIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="20" r="6" fill="#e8847f"/>
        <circle cx="44" cy="28" r="6" fill="#e8847f"/>
        <circle cx="44" cy="44" r="6" fill="#e8847f"/>
        <circle cx="32" cy="52" r="6" fill="#e8847f"/>
        <circle cx="20" cy="44" r="6" fill="#e8847f"/>
        <circle cx="20" cy="28" r="6" fill="#e8847f"/>
        <circle cx="32" cy="36" r="8" fill="#FFD700"/>
        <path d="M32 52L32 60" stroke="#228B22" strokeWidth="3"/>
      </svg>
    );

    const TruckIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="20" width="32" height="20" rx="2" stroke="#2d6a4f" strokeWidth="2"/>
        <circle cx="24" cy="48" r="4" stroke="#2d6a4f" strokeWidth="2"/>
        <circle cx="48" cy="48" r="4" stroke="#2d6a4f" strokeWidth="2"/>
        <path d="M48 28V24H58L58 36H48" stroke="#2d6a4f" strokeWidth="2"/>
      </svg>
    );

    const PlaneIcon = () => (
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 12L44 32H32V52L12 32L32 20V12Z" fill="#2d6a4f" opacity="0.2"/>
        <path d="M32 12L44 32H32V52L12 32L32 20V12Z" stroke="#2d6a4f" strokeWidth="2"/>
      </svg>
    );

    // COMPONENTS
    const Hero = () => (
      <motion.div
        className="hero"
        initial={{ opacity: 0 }}
        animate={{ opacity: 1 }}
        transition={{ duration: 0.8 }}
      >
        <div className="hero-content">
          <motion.h1
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, delay: 0.2 }}
          >
            Del campo ecuatoriano al mundo
          </motion.h1>

          <motion.p
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, delay: 0.4 }}
          >
            Conecta directo florícolas, logística y transporte. Sin intermediarios, márgenes mejores.
          </motion.p>

          <motion.div
            className="hero-buttons"
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, delay: 0.6 }}
          >
            <a href="registro.html" className="btn-primary">Registrar empresa</a>
            <button className="btn-secondary">Ver directorio</button>
          </motion.div>
        </div>
      </motion.div>
    );

    const Features = () => (
      <section className="section" id="features">
        <motion.h2
          className="section-title"
          initial={{ opacity: 0, y: 20 }}
          whileInView={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.6 }}
          viewport={{ once: true }}
        >
          ¿Por qué ConectaFlor?
        </motion.h2>
        <p className="section-subtitle">Beneficios reales para tu negocio</p>

        <div className="cards-grid">
          {[
            { icon: CheckIcon, title: 'Verificado', text: 'Solo empresas legales. Validación rigurosa.' },
            { icon: MoneyIcon, title: 'Gratis', text: 'Sin comisiones, sin cuotas ocultas.' },
            { icon: BoltIcon, title: 'Directo', text: 'Negocia sin intermediarios, márgenes mejores.' },
            { icon: GlobeIcon, title: 'Internacional', text: 'Conecta con logística especializada en exportación.' }
          ].map((item, i) => (
            <motion.div
              key={i}
              className="card"
              initial={{ opacity: 0, y: 30 }}
              whileInView={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.6, delay: i * 0.1 }}
              viewport={{ once: true }}
              whileHover={{ scale: 1.05 }}
            >
              <div className="card-icon">
                <item.icon />
              </div>
              <h3 className="card-title">{item.title}</h3>
              <p className="card-text">{item.text}</p>
            </motion.div>
          ))}
        </div>
      </section>
    );

    const HowItWorks = () => (
      <section className="section" id="flow">
        <motion.h2
          className="section-title"
          initial={{ opacity: 0, y: 20 }}
          whileInView={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.6 }}
          viewport={{ once: true }}
        >
          ¿Cómo funciona?
        </motion.h2>
        <p className="section-subtitle">El flujo completo de negocio</p>

        <div className="flow-container">
          {/* STAGE 1 */}
          <motion.div
            className="flow-box"
            initial={{ opacity: 0, scale: 0.8 }}
            whileInView={{ opacity: 1, scale: 1 }}
            transition={{ duration: 0.6, delay: 0 }}
            viewport={{ once: true }}
            whileHover={{ scale: 1.05 }}
          >
            <motion.div
              className="flow-icon"
              animate={{ y: [0, -10, 0] }}
              transition={{ duration: 2, repeat: Infinity }}
            >
              <FlowerIcon />
            </motion.div>
            <h3 className="flow-title">Cultivo de Flores</h3>
            <p className="flow-text">Publica tu producción, especifica variedades y cantidad</p>
          </motion.div>

          <motion.div
            className="flow-arrow"
            initial={{ opacity: 0 }}
            whileInView={{ opacity: 1 }}
            transition={{ duration: 0.6, delay: 0.3 }}
            viewport={{ once: true }}
          >
            →
          </motion.div>

          {/* STAGE 2 & 3 */}
          <motion.div
            style={{ display: 'flex', gap: '2rem', flexWrap: 'wrap', justifyContent: 'center' }}
            initial={{ opacity: 0 }}
            whileInView={{ opacity: 1 }}
            transition={{ duration: 0.6, delay: 0.6 }}
            viewport={{ once: true }}
          >
            <motion.div
              className="flow-box"
              whileHover={{ scale: 1.05 }}
            >
              <motion.div
                className="flow-icon"
                animate={{ y: [0, -10, 0] }}
                transition={{ duration: 2, repeat: Infinity, delay: 0.2 }}
              >
                <TruckIcon />
              </motion.div>
              <h3 className="flow-title">Transporte</h3>
              <p className="flow-text">Recogida refrigerada y transporte seguro</p>
            </motion.div>

            <motion.div
              className="flow-box"
              whileHover={{ scale: 1.05 }}
            >
              <motion.div
                className="flow-icon"
                animate={{ y: [0, -10, 0] }}
                transition={{ duration: 2, repeat: Infinity, delay: 0.4 }}
              >
                <PlaneIcon />
              </motion.div>
              <h3 className="flow-title">Logística Export</h3>
              <p className="flow-text">Trámites aduanales y envío internacional</p>
            </motion.div>
          </motion.div>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="footer">
        <div className="footer-links">
          <a href="#features">Características</a>
          <a href="#flow">Cómo funciona</a>
          <a href="panel.html">Mi panel</a>
          <a href="admin.html">Admin</a>
        </div>
        <p><strong>ConectaFlor</strong> © 2024 — Flores de Ecuador al mundo 🌹</p>
        <p className="footer-text">Flores verificadas, directo, gratuito • Conectando florícolas, logística y transporte</p>
      </footer>
    );

    const App = () => (
      <>
        <motion.header className="header">
          <div className="logo">🌿 ConectaFlor</div>
          <nav className="nav">
            <a href="#features">Características</a>
            <a href="#flow">Cómo funciona</a>
            <a href="panel.html">Panel</a>
            <a href="registro.html" className="btn-cta">Registrar</a>
          </nav>
        </motion.header>

        <Hero />
        <Features />
        <HowItWorks />
        <Footer />
      </>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
