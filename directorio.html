<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Directorio · ConectaFlor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css" />
<style>
body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #f5f5f5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 28px; padding: 0 2rem; }
.card { background: #fff; border-left: 6px solid #15803D; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card.floricola { border-left-color: #EC4899; background: linear-gradient(135deg, #fff 0%, #fce7f3 100%); }
.card.logistica { border-left-color: #3b82f6; background: linear-gradient(135deg, #fff 0%, #dbeafe 100%); }
.card.transporte { border-left-color: #f59e0b; background: linear-gradient(135deg, #fff 0%, #fef3c7 100%); }
.card h3 { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; color: #2d3748; }
.card-badge { display: inline-block; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 12px; }
.card.floricola .card-badge { background: #EC4899; color: white; }
.card.logistica .card-badge { background: #3b82f6; color: white; }
.card.transporte .card-badge { background: #f59e0b; color: white; }
.card-detail { font-size: 0.9rem; color: #718096; margin: 10px 0; }
.card-detail strong { color: #2d3748; font-weight: 600; }
.btn-action { flex: 1; padding: 10px 14px; font-size: 0.85rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
.card.floricola .btn-action { background: #EC4899; color: white; }
.card.floricola .btn-action:hover { background: #db2777; transform: translateY(-2px); }
.card.logistica .btn-action { background: #3b82f6; color: white; }
.card.logistica .btn-action:hover { background: #2563eb; transform: translateY(-2px); }
.card.transporte .btn-action { background: #f59e0b; color: white; }
.card.transporte .btn-action:hover { background: #d97706; transform: translateY(-2px); }
.card-actions { display: flex; gap: 8px; margin-top: 16px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 16px; }
.loading { text-align: center; padding: 40px 20px; }
.header-title { text-align: center; padding: 40px 0 30px; }
.header-title h1 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
.error { color: #c53030; text-align: center; padding: 40px 20px; }
</style>
</head>
<body>

<nav class="nav">
<div class="nav-inner">
<a class="brand" href="index.html">🌹 ConectaFlor</a>
<div class="nav-links">
<a href="index.html">Inicio</a>
<a href="directorio.html">Directorio</a>
<a href="registro.html">Registrar</a>
<a href="panel.html">Iniciar sesión</a>
</div>
</div>
</nav>

<div class="wrap" style="padding-top: 40px;">
<div class="header-title">
<h1>Directorio de empresas</h1>
<p style="color: #718096;">Explora florícolas, logística y transporte verificados.</p>
</div>

<div id="loading" class="loading">Cargando empresas...</div>
<div id="error" class="error" style="display:none;"></div>
<div id="grid" class="grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
(async function loadDir() {
  for (let i = 0; i < 100; i++) {
    if (typeof getDB === "function") {
      try {
        const db = getDB();
        const { data: companies, error } = await db.from("listings").select("*").eq("status", "approved").order("created_at", { ascending: false });
        if (error) throw error;
        document.getElementById("loading").style.display = "none";
        const grid = document.getElementById("grid");
        if (companies && companies.length > 0) {
          function esc(v) { if (!v) return ""; return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
          function getTipo(t) { return t === "floricola" ? "🌹 Florícola" : t === "logistica" ? "✈️ Logística" : "🚛 Transporte"; }
          grid.innerHTML = companies.map(c => {
            const ubicacion = [c.ciudad, c.provincia].filter(Boolean).join(", ") || "—";
            const desc = c.tipos_flores || c.servicios || c.descripcion || "—";
            const contacto = c.contacto_nombre || c.email || c.telefono || "—";
            return `<div class="card ${c.tipo}"><span class="card-badge">${getTipo(c.tipo)}</span><h3>${esc(c.nombre_empresa)}</h3><div class="card-detail"><strong>Ubicación:</strong> ${esc(ubicacion)}</div><div class="card-detail"><strong>Ofrece:</strong> ${esc(desc)}</div><div class="card-detail"><strong>Contacto:</strong> ${esc(contacto)}</div><div class="card-actions"><button class="btn-action" onclick="alert('Contactar a: ${esc(contacto)}')">Contactar</button><button class="btn-action" onclick="window.location.href='/panel.html?solicitar=${esc(c.id)}'">Solicitar</button></div></div>`;
          }).join("");
        } else {
          grid.innerHTML = "<div style='text-align:center;padding:40px;color:#718096;grid-column:1/-1'>No hay empresas registradas</div>";
        }
        return;
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").innerHTML = "Error: " + err.message;
        return;
      }
    }
    await new Promise(r => setTimeout(r, 100));
  }
  document.getElementById("error").style.display = "block";
  document.getElementById("error").innerHTML = "Error: getDB no disponible después de 10 segundos";
})();
</script>

</body>
</html>
